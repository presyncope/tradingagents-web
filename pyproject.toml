[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tradingagents-web"
version = "0.1.0"
description = "Web UI for the TradingAgents multi-agent analysis framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tradingagents",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "nh3>=0.2.17",
    "python-dotenv>=1.0",
    # IANA zones for TRADINGAGENTS_WEB_TZ where the system has no tz database (slim images).
    "tzdata>=2024.1",
]

[project.scripts]
tradingagents-web = "tradingagents_web.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16",
]

[tool.uv.sources]
# The upstream repository has both a branch and a tag named v0.5.2; pin the tag.
tradingagents = { git = "https://github.com/TauricResearch/TradingAgents.git", tag = "v0.5.2" }

[tool.hatch.build.targets.wheel]
packages = ["src/tradingagents_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
